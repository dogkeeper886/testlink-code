name: Docker Publish

# Manual-only: publishing pushes a public image, so it happens when someone
# decides to release, never on a push. Restricted to the main branch via the
# publish job's `if:` guard so an accidental dispatch from a feature branch
# can't publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, e.g. mcp-1.0.0. Must point at the commit being built."
        required: true
        type: string

jobs:
  build-test:
    name: Build Tests
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: build
    secrets: inherit

  publish:
    name: Build & Push Docker Image
    needs: build-test
    # Guard: only ever publish from the main branch, even when dispatched.
    if: github.ref == 'refs/heads/main'
    # The self-hosted runner is already `docker login`-ed to Docker Hub, so
    # there is no login step and no registry secrets here.
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      # First, and before the checkout: this job depends on the runner already
      # holding a Docker Hub login, which is ambient machine state no one can
      # read from here. Establishing that costs a second; discovering it after
      # a --no-cache --pull build of a php:7.4-apache image does not. The
      # identity of the runner is printed either way, because "which machine is
      # this?" is the question that sends people looking in the wrong place.
      - name: Preflight — runner identity and Docker Hub login
        run: |
          set -uo pipefail
          echo "runner host : $(hostname)"
          echo "runner user : $(whoami)"
          echo "runner name : ${RUNNER_NAME:-unknown}"
          USER_ENTRY=$(docker info 2>/dev/null | sed -n 's/^ *Username: *//p')
          if [ -z "${USER_ENTRY}" ]; then
            echo "::error::No Docker Hub login found for user $(whoami) on $(hostname). \
          Docker credentials are per-user, so a login performed as another account does not \
          apply here. Either run 'docker login' as this user on this machine, or switch the \
          workflow to DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets."
            exit 1
          fi
          echo "docker hub  : logged in as ${USER_ENTRY}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are needed to verify the release tag below; the default
          # checkout fetches none.
          fetch-depth: 0

      - name: Verify the release tag points at this commit
        # An image labelled mcp-1.0.0 must contain mcp-1.0.0's code. If main has
        # moved past the tag, stop rather than publish a mislabelled image.
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} does not exist."
            exit 1
          fi
          TAG_SHA=$(git rev-parse "${VERSION}^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
            echo "::error::Tag ${VERSION} points at ${TAG_SHA} but HEAD is ${HEAD_SHA}."
            exit 1
          fi
          echo "${VERSION} verified at ${HEAD_SHA}"

          # The git tag, this image's tag, and TL_VERSION_NUMBER are one string.
          # A release that reports a version it is not cannot be un-published, so
          # the mismatch has to stop the build rather than be noticed later.
          if ! grep -q "define('TL_VERSION_NUMBER', '${VERSION}')" cfg/const.inc.php; then
            echo "::error::TL_VERSION_NUMBER in cfg/const.inc.php does not match ${VERSION}."
            grep -n "TL_VERSION_NUMBER" cfg/const.inc.php
            exit 1
          fi
          echo "TL_VERSION_NUMBER matches ${VERSION}"

      - name: Build and push
        env:
          IMAGE: dogkeeper886/testlink-code
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # --no-cache --pull: a release build comes from current source and a
          # fresh base image, never from layers cached on the persistent runner.
          docker build --no-cache --pull \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.version="${VERSION}" \
            --label org.opencontainers.image.base.name=testlink:1.9.20 \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
