name: Docker Publish

# Manual-only: publishing pushes a public image, so it happens when someone
# decides to release, never on a push. Restricted to the main branch via the
# publish job's `if:` guard so an accidental dispatch from a feature branch
# can't publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, e.g. mcp-1.0.0. Must point at the commit being built."
        required: true
        type: string

jobs:
  build-test:
    name: Build Tests
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: build
    secrets: inherit

  publish:
    name: Build & Push Docker Image
    needs: build-test
    # Guard: only ever publish from the main branch, even when dispatched.
    if: github.ref == 'refs/heads/main'
    # The self-hosted runner is already `docker login`-ed to Docker Hub, so
    # there is no login step and no registry secrets here.
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are needed to verify the release tag below; the default
          # checkout fetches none.
          fetch-depth: 0

      - name: Verify the release tag points at this commit
        # An image labelled mcp-1.0.0 must contain mcp-1.0.0's code. If main has
        # moved past the tag, stop rather than publish a mislabelled image.
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if ! git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} does not exist."
            exit 1
          fi
          TAG_SHA=$(git rev-parse "${VERSION}^{commit}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
            echo "::error::Tag ${VERSION} points at ${TAG_SHA} but HEAD is ${HEAD_SHA}."
            exit 1
          fi
          echo "${VERSION} verified at ${HEAD_SHA}"

      - name: Build and push
        env:
          IMAGE: dogkeeper886/testlink-code
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # --no-cache --pull: a release build comes from current source and a
          # fresh base image, never from layers cached on the persistent runner.
          docker build --no-cache --pull \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.version="${VERSION}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
