name: CI Pipeline

on:
  # Manual-only: trigger from the Actions tab. No automatic firing on push
  # or PR — keeps CI noise off feature branches and lets you run the suite
  # against any ref on demand.
  workflow_dispatch:
    inputs:
      judge_mode:
        description: "Test judge mode"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"

jobs:
  build:
    name: Build Tests
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: build
      judge_mode: ${{ inputs.judge_mode || 'simple' }}

  smoke:
    name: Smoke Tests
    needs: build
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: smoke
      judge_mode: ${{ inputs.judge_mode || 'simple' }}

  auth:
    name: Auth Tests
    needs: smoke
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: auth
      judge_mode: ${{ inputs.judge_mode || 'simple' }}

  crud:
    name: CRUD Tests
    needs: auth
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: crud
      judge_mode: ${{ inputs.judge_mode || 'simple' }}

  workflow:
    name: Workflow Tests
    needs: crud
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: workflow
      judge_mode: ${{ inputs.judge_mode || 'simple' }}
