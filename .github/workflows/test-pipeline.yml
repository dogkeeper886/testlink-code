name: CI Pipeline

on:
  # Manual-only: trigger from the Actions tab. No automatic firing on push
  # or PR — keeps CI noise off feature branches and lets you run the suite
  # against any ref on demand.
  workflow_dispatch:
    inputs:
      judge_mode:
        description: "Test judge mode"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"
      runner:
        description: "Runner to dispatch on. Use self-hosted to reach LAN Ollama."
        required: false
        default: "ubuntu-latest"
        type: choice
        options:
          - "ubuntu-latest"
          - "self-hosted"

jobs:
  build:
    name: Build Tests
    uses: ./.github/workflows/test-suite.yml
    secrets: inherit
    with:
      suite: build
      judge_mode: ${{ inputs.judge_mode || 'simple' }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  smoke:
    name: Smoke Tests
    needs: build
    uses: ./.github/workflows/test-suite.yml
    secrets: inherit
    with:
      suite: smoke
      judge_mode: ${{ inputs.judge_mode || 'simple' }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  auth:
    name: Auth Tests
    needs: smoke
    uses: ./.github/workflows/test-suite.yml
    secrets: inherit
    with:
      suite: auth
      judge_mode: ${{ inputs.judge_mode || 'simple' }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  crud:
    name: CRUD Tests
    needs: auth
    uses: ./.github/workflows/test-suite.yml
    secrets: inherit
    with:
      suite: crud
      judge_mode: ${{ inputs.judge_mode || 'simple' }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}

  workflow:
    name: Workflow Tests
    needs: crud
    uses: ./.github/workflows/test-suite.yml
    secrets: inherit
    with:
      suite: workflow
      judge_mode: ${{ inputs.judge_mode || 'simple' }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
