name: CI Pipeline

on:
  # Only fire automatically on push to the main branch. PRs do not trigger;
  # use workflow_dispatch from the Actions tab to run against a feature
  # branch on demand.
  push:
    branches: ["testlink_1_9_20_fixed"]
  workflow_dispatch:
    inputs:
      judge_mode:
        description: "Test judge mode"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"

jobs:
  build:
    name: Build Tests
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: build
      judge_mode: ${{ inputs.judge_mode || 'simple' }}

  smoke:
    name: Smoke Tests
    needs: build
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: smoke
      judge_mode: ${{ inputs.judge_mode || 'simple' }}

  auth:
    name: Auth Tests
    needs: smoke
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: auth
      judge_mode: ${{ inputs.judge_mode || 'simple' }}

  crud:
    name: CRUD Tests
    needs: auth
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: crud
      judge_mode: ${{ inputs.judge_mode || 'simple' }}

  workflow:
    name: Workflow Tests
    needs: crud
    uses: ./.github/workflows/test-suite.yml
    with:
      suite: workflow
      judge_mode: ${{ inputs.judge_mode || 'simple' }}
