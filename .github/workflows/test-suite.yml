name: Test Suite

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        type: choice
        options:
          - "build"
          - "smoke"
          - "auth"
          - "crud"
          - "workflow"
          - "negative"
          - "regression"
          - "all"
      judge_mode:
        description: "Test judge mode"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"
      judge_model:
        description: "LLM model (leave blank to use the self-hosted runner's LLM_JUDGE_MODEL or framework default gemma3:4b)"
        required: false
        default: ""
        type: string
      runner:
        description: "Runner to dispatch on. Use self-hosted to reach LAN Ollama."
        required: false
        default: "ubuntu-latest"
        type: choice
        options:
          - "ubuntu-latest"
          - "self-hosted"
  workflow_call:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        type: string
      judge_mode:
        description: "Test judge mode (simple, dual)"
        required: false
        default: "simple"
        type: string
      judge_model:
        description: "LLM model override; empty means use the runner's LLM_JUDGE_MODEL / framework default"
        required: false
        default: ""
        type: string
      runner:
        description: "Runner label. 'ubuntu-latest' or 'self-hosted'."
        required: false
        default: "ubuntu-latest"
        type: string
    outputs:
      result:
        description: "Test result"
        value: ${{ jobs.test.outputs.result }}

jobs:
  test:
    name: Run ${{ inputs.suite }} Tests
    runs-on: ${{ inputs.runner }}
    outputs:
      result: ${{ steps.run-tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test runner dependencies
        run: cd cicd/tests && npm ci

      - name: Run tests
        id: run-tests
        env:
          # TL_DEV_KEY is the only LLM/credential value still flowed via GH
          # secrets — the runner's process env supplies LLM_JUDGE_URL and
          # LLM_JUDGE_MODEL on self-hosted (see CI_SETUP.md "Set the LLM
          # endpoint"), and hosted runners don't run dual mode. When unset,
          # the scripts' defaults kick in (see cicd/scripts/init-db.sh).
          TL_DEV_KEY: ${{ secrets.TL_DEV_KEY }}
        run: |
          # Build judge flags based on input.
          # In dual mode, only append --judge-model when the operator typed
          # one at dispatch time. Otherwise let LLM_JUDGE_MODEL (provided by
          # the self-hosted runner's root .env) or the framework default in
          # config.ts take effect — a CLI flag would shadow them.
          JUDGE_FLAGS=""
          if [ "${{ inputs.judge_mode }}" = "simple" ] || [ -z "${{ inputs.judge_mode }}" ]; then
            JUDGE_FLAGS="--no-llm"
          elif [ -n "${{ inputs.judge_model }}" ]; then
            JUDGE_FLAGS="--judge-model ${{ inputs.judge_model }}"
          fi

          # Build suite flag
          SUITE_FLAG=""
          if [ "${{ inputs.suite }}" != "all" ]; then
            SUITE_FLAG="--suite ${{ inputs.suite }}"
          fi

          echo "Suite: ${{ inputs.suite }}"
          echo "Judge mode: ${{ inputs.judge_mode || 'simple' }}"
          echo "Judge flags: $JUDGE_FLAGS"

          # Run through the wrapper: handles ci-up before and ci-down after
          # (trap EXIT) so teardown is guaranteed even on test failure.
          bash cicd/scripts/run-tests.sh $SUITE_FLAG $JUDGE_FLAGS --format json > /tmp/test-results.json || true

          echo "--- JSON Results ---"
          cat /tmp/test-results.json

      - name: Check test results
        run: |
          if [ ! -f /tmp/test-results.json ] || [ ! -s /tmp/test-results.json ]; then
            echo "::error::No test results found"
            exit 1
          fi
          FAILED=$(jq '.summary.failed' /tmp/test-results.json)
          echo "Failed tests: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.suite }}-test-results
          path: |
            /tmp/test-results.json
            cicd/results/
