id: TC-CRUD-002
name: Test suite CRUD
suite: crud
priority: 2
timeout: 60000
dependencies:
  - TC-AUTH-001

steps:
  - name: Create parent project (setup)
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.createTestProject</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>testprojectname</name><value><string>proj-{{testId}}-{{runId}}</string></value></member>
        <member><name>testcaseprefix</name><value><string>P{{runId}}</string></value></member>
        <member><name>notes</name><value><string>{{testId}}</string></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "<name>id</name>"
    capture:
      projectId: "id"

  - name: Create test suite under the project
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.createTestSuite</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>testprojectid</name><value><int>{{projectId}}</int></value></member>
        <member><name>testsuitename</name><value><string>suite-{{testId}}-{{runId}}</string></value></member>
        <member><name>details</name><value><string>Created by {{testId}}</string></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "<name>id</name>"
    capture:
      suiteId: "id"

  - name: Read test suite back
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.getTestSuiteByID</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>testsuiteid</name><value><int>{{suiteId}}</int></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "suite-{{testId}}-{{runId}}"

  - name: Delete test suite (teardown)
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.deleteTestSuite</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>testsuiteid</name><value><int>{{suiteId}}</int></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "<boolean>1</boolean>|status.*true"

  - name: Delete parent project (teardown)
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.deleteTestProject</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>prefix</name><value><string>P{{runId}}</string></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "<boolean>1</boolean>|status.*true"

objective: |
  Confirm the Test Suite entity supports CRUD under a parent project, with
  parent-child IDs flowing through capture (no hardcoded numeric literals).
  This validates the project→suite hierarchy that case-level tests build on.

judgeContext: |
  Five steps form a setup → exercise → teardown sequence:
  1. Create parent project — needed because suites can't exist without one.
  2. Create suite under {{projectId}} — captures suiteId from response.
  3. Read suite by {{suiteId}} — proves the suite's name round-trips.
  4. Delete suite by {{suiteId}}.
  5. Delete project by prefix.

  Steps 4 and 5 are reverse-creation-order teardown; both must succeed
  even if step 3 fails (the framework runs them as part of the case).

  All XML-RPC calls go through xmlrpc-capture.sh (raw response in stderr,
  JSON envelope in stdout). Successful create responses contain
  <name>id</name>; successful reads contain the literal entity name;
  successful deletes contain <boolean>1</boolean>.

  Silent failures to watch for:
  - Suite created but assigned to a different parent project (read still
    returns the right name, but the parent_id in the response is wrong —
    not directly checked here, but suspicious if entity counts in the
    container logs disagree).
  - Teardown delete returns true but only deleted a stale entity from a
    previous run, leaving the new entity orphaned. Run-ID-suffixed names
    make this unlikely, but flag if container logs show double-delete
    or constraint violations.
  - Read returns a fault envelope but the suite name string happens to
    appear in the fault message — false positive.

criteria: |
  PASS when:
  - Steps 1, 2 each return a new id (visible in <name>id</name>).
  - Step 3 stderr contains "suite-{{testId}}-{{runId}}".
  - Steps 4, 5 each return <boolean>1</boolean>.

  FAIL on any fault envelope, missing entity, name mismatch, or
  incomplete teardown (residue would block re-runs).
