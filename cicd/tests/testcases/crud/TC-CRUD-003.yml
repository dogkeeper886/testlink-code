id: TC-CRUD-003
name: Test case CRUD
suite: crud
priority: 3
timeout: 60000
dependencies:
  - TC-AUTH-001

steps:
  - name: Create parent project (setup)
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.createTestProject</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>testprojectname</name><value><string>proj-{{testId}}-{{runId}}</string></value></member>
        <member><name>testcaseprefix</name><value><string>P{{runId}}</string></value></member>
        <member><name>notes</name><value><string>{{testId}}</string></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "<name>id</name>"
    capture:
      projectId: "id"

  - name: Create parent test suite (setup)
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.createTestSuite</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>testprojectid</name><value><int>{{projectId}}</int></value></member>
        <member><name>testsuitename</name><value><string>suite-{{testId}}-{{runId}}</string></value></member>
        <member><name>details</name><value><string>Created by {{testId}}</string></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "<name>id</name>"
    capture:
      suiteId: "id"

  - name: Create test case
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.createTestCase</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>testcasename</name><value><string>case-{{testId}}-{{runId}}</string></value></member>
        <member><name>testsuiteid</name><value><int>{{suiteId}}</int></value></member>
        <member><name>testprojectid</name><value><int>{{projectId}}</int></value></member>
        <member><name>authorlogin</name><value><string>admin</string></value></member>
        <member><name>summary</name><value><string>Created by {{testId}}</string></value></member>
        <member><name>steps</name><value><array><data><value><struct>
          <member><name>step_number</name><value><int>1</int></value></member>
          <member><name>actions</name><value><string>noop</string></value></member>
          <member><name>expected_results</name><value><string>ok</string></value></member>
        </struct></value></data></array></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "<name>id</name>"
    capture:
      caseId: "id"

  - name: Read test case back
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.getTestCase</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>testcaseid</name><value><int>{{caseId}}</int></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "case-{{testId}}-{{runId}}"

  - name: Delete test case (teardown)
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.deleteTestCase</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>testcaseid</name><value><int>{{caseId}}</int></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "<boolean>1</boolean>|status.*true"

  - name: Delete parent suite (teardown)
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.deleteTestSuite</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>testsuiteid</name><value><int>{{suiteId}}</int></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "<boolean>1</boolean>|status.*true"

  - name: Delete parent project (teardown)
    command: |
      bash cicd/scripts/xmlrpc-capture.sh <<'XMLDOC'
      <?xml version="1.0"?><methodCall><methodName>tl.deleteTestProject</methodName><params><param><value><struct>
        <member><name>devKey</name><value><string>{{devKey}}</string></value></member>
        <member><name>prefix</name><value><string>P{{runId}}</string></value></member>
      </struct></value></param></params></methodCall>
      XMLDOC
    expectPatterns:
      - "<boolean>1</boolean>|status.*true"

objective: |
  Confirm the Test Case entity supports CRUD under the suite/project
  hierarchy, including the steps[] sub-structure. Test Case is the leaf
  entity TestLink users actually author against, so its CRUD path is the
  most user-visible.

judgeContext: |
  Seven steps in setup → create-leaf → read → reverse-teardown order:
  1. Create parent project (P<runId> prefix)
  2. Create parent suite under that project
  3. Create test case under that suite, with one inline step entry
  4. Read the case back by ID, verify its name
  5-7. Delete case → suite → project (reverse creation order)

  The test exercises:
  - tl.createTestCase with embedded steps[] array (deeper XML-RPC payload
    than the simpler create operations)
  - getTestCase round-trip (case names round-trip via the suite hierarchy)
  - cascade-aware teardown that doesn't rely on cascading deletes

  All calls go through xmlrpc-capture.sh (raw XML in stderr, JSON envelope
  in stdout). Each create captures its new ID into a variable used by
  subsequent steps; no numeric literals are baked into params.

  Silent failures to watch for:
  - Case created but with empty steps[] (the embedded steps array got
    serialized incorrectly). Read might still return the name, masking
    the data-loss. Container logs may show steps_get returning 0 rows.
  - Read returns the right name but a different testcaseid (rare; would
    indicate a routing bug).
  - Teardown delete-case returns true but the case row stays in the DB
    because of an FK constraint — would block re-runs and surface as
    "duplicate name" on the next attempt.

criteria: |
  PASS when:
  - Steps 1-3 each return a new id (visible in <name>id</name>).
  - Step 4 stderr contains "case-{{testId}}-{{runId}}".
  - Steps 5-7 each return <boolean>1</boolean>.

  FAIL on any fault envelope, missing entity, name mismatch, or
  incomplete teardown (would prevent idempotent re-run).
