id: TC-E2E-001
name: Full CRUD Workflow via XML-RPC
suite: e2e
priority: 1
timeout: 120000
dependencies:
  - TC-INTEGRATION-003

steps:
  - name: Create test project
    command: |
      curl -sf -X POST http://localhost:8090/lib/api/xmlrpc/v1/xmlrpc.php \
        -H "Content-Type: text/xml" \
        -d '<?xml version="1.0"?><methodCall><methodName>tl.createTestProject</methodName><params><param><value><struct>
          <member><name>devKey</name><value><string>a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4</string></value></member>
          <member><name>testprojectname</name><value><string>CI Test Project</string></value></member>
          <member><name>testcaseprefix</name><value><string>CIT</string></value></member>
          <member><name>notes</name><value><string>Created by CI pipeline</string></value></member>
        </struct></value></param></params></methodCall>'
    expectPatterns:
      - "Success|id"

  - name: Create test suite
    command: |
      # Extract project ID from previous response — get the first integer id value
      curl -sf -X POST http://localhost:8090/lib/api/xmlrpc/v1/xmlrpc.php \
        -H "Content-Type: text/xml" \
        -d '<?xml version="1.0"?><methodCall><methodName>tl.createTestSuite</methodName><params><param><value><struct>
          <member><name>devKey</name><value><string>a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4</string></value></member>
          <member><name>testprojectid</name><value><int>1</int></value></member>
          <member><name>testsuitename</name><value><string>CI Suite</string></value></member>
          <member><name>details</name><value><string>Suite created by CI</string></value></member>
        </struct></value></param></params></methodCall>'
    expectPatterns:
      - "id|name_already_exists"

  - name: Create test case
    command: |
      curl -sf -X POST http://localhost:8090/lib/api/xmlrpc/v1/xmlrpc.php \
        -H "Content-Type: text/xml" \
        -d '<?xml version="1.0"?><methodCall><methodName>tl.createTestCase</methodName><params><param><value><struct>
          <member><name>devKey</name><value><string>a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4</string></value></member>
          <member><name>testcasename</name><value><string>CI Smoke Test</string></value></member>
          <member><name>testsuiteid</name><value><int>2</int></value></member>
          <member><name>testprojectid</name><value><int>1</int></value></member>
          <member><name>authorlogin</name><value><string>admin</string></value></member>
          <member><name>summary</name><value><string>Automated CI smoke test</string></value></member>
          <member><name>steps</name><value><array><data><value><struct>
            <member><name>step_number</name><value><int>1</int></value></member>
            <member><name>actions</name><value><string>Verify system is operational</string></value></member>
            <member><name>expected_results</name><value><string>System responds correctly</string></value></member>
          </struct></value></data></array></value></member>
        </struct></value></param></params></methodCall>'
    expectPatterns:
      - "id|Success"

  - name: Verify test case was created
    command: |
      curl -sf -X POST http://localhost:8090/lib/api/xmlrpc/v1/xmlrpc.php \
        -H "Content-Type: text/xml" \
        -d '<?xml version="1.0"?><methodCall><methodName>tl.getTestCase</methodName><params><param><value><struct>
          <member><name>devKey</name><value><string>a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4</string></value></member>
          <member><name>testcaseexternalid</name><value><string>CIT-1</string></value></member>
        </struct></value></param></params></methodCall>'
    expectPatterns:
      - "CI Smoke Test"

  - name: Delete test case via API
    command: |
      curl -sf -X POST http://localhost:8090/lib/api/xmlrpc/v1/xmlrpc.php \
        -H "Content-Type: text/xml" \
        -d '<?xml version="1.0"?><methodCall><methodName>tl.deleteTestCase</methodName><params><param><value><struct>
          <member><name>devKey</name><value><string>a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4</string></value></member>
          <member><name>testcaseexternalid</name><value><string>CIT-1</string></value></member>
        </struct></value></param></params></methodCall>'
    expectPatterns:
      - "Success|status.*1|true"

  - name: Delete test suite via API
    command: |
      curl -sf -X POST http://localhost:8090/lib/api/xmlrpc/v1/xmlrpc.php \
        -H "Content-Type: text/xml" \
        -d '<?xml version="1.0"?><methodCall><methodName>tl.deleteTestSuite</methodName><params><param><value><struct>
          <member><name>devKey</name><value><string>a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4</string></value></member>
          <member><name>testsuiteid</name><value><int>2</int></value></member>
        </struct></value></param></params></methodCall>'
    expectPatterns:
      - "Success|status.*1|true"

  - name: Tear down CI environment
    command: bash ./cicd/scripts/ci-down.sh
    timeout: 30000

criteria: |
  Verify full CRUD workflow through XML-RPC API:
  - Create a test project with prefix CIT
  - Create a test suite under the project
  - Create a test case in the suite
  - Retrieve and verify the test case
  - Delete the test case via tl.deleteTestCase
  - Delete the test suite via tl.deleteTestSuite
  - Clean up the environment
