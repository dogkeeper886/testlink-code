id: TC-INTEGRATION-001
name: TestLink Login Page Responds
suite: integration
priority: 1
timeout: 30000
dependencies: []

steps:
  - name: Verify app is responding
    command: |
      curl -sf http://localhost:8090/login.php | grep -o "Login" | head -1
    expectPatterns:
      - "Login"

criteria: |
  Verify the login page is served on port 8090.
  Session setup (docker compose up, DB init) is handled by
  cicd/scripts/run-tests.sh before any test runs.
