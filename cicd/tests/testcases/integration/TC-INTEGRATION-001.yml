id: TC-INTEGRATION-001
name: TestLink Container Startup
suite: integration
priority: 1
timeout: 180000
dependencies:
  - TC-BUILD-002

steps:
  - name: Start CI environment
    command: bash ./cicd/scripts/ci-up.sh
    timeout: 150000

  - name: Verify app is responding
    command: |
      curl -sf http://localhost:8090/login.php | grep -o "Login" | head -1
    expectPatterns:
      - "Login"

criteria: |
  Verify TestLink starts and serves the login page:
  - Docker containers start (app + postgres)
  - Database is initialized with schema and default data
  - Login page is accessible on port 8090
