id: TC-SMOKE-001
name: Login page responds
suite: smoke
priority: 1
timeout: 30000
dependencies: []

steps:
  - name: GET /login.php
    command: curl -sf http://localhost:8090/login.php | grep -o "Login" | head -1
    expectPatterns:
      - "Login"

criteria: |
  Baseline check: the HTTP server is up and serving the login page.
  Session setup (docker compose up + DB init) is handled by
  cicd/scripts/run-tests.sh before any test runs.
